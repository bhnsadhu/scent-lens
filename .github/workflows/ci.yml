name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install light dependencies (no torch, no gradio)
        run: pip install -r requirements-ci.txt
      - name: Lint
        run: ruff check src tests scripts app
      - name: Unit tests on toy fixtures
        env:
          HF_HUB_OFFLINE: "1"
        run: pytest -q -m "not torch"
