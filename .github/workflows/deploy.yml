name: deploy

# Redeploys the demo on Modal (deploy/modal_app.py) when a push to main changes what it serves.
# The model export and sample photos are not in git; they wait in the Modal Volume
# "scent-lens-data" (scripts/upload_demo_data.sh). Needs the repository secrets
# MODAL_TOKEN_ID and MODAL_TOKEN_SECRET.
on:
  push:
    branches: [main]
    paths:
      - app/**
      - src/scent_lens/**
      - deploy/modal_app.py
      - deploy/brand/**
      - scripts/build_space.py
      - .github/workflows/deploy.yml
  workflow_dispatch:

# One deploy at a time; a newer push waits rather than cancelling one halfway.
concurrency:
  group: deploy-modal
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install light dependencies and Modal
        run: pip install -r requirements-ci.txt modal==1.6.3
      # The same checks as ci.yml, so a broken push never reaches the live demo.
      - name: Lint
        run: ruff check .
      - name: Unit tests on toy fixtures
        env:
          HF_HUB_OFFLINE: "1"
        run: pytest -q -m "not torch"
      - name: Build the code bundle
        run: python scripts/build_space.py ${{ github.repository_owner }} --code-only
      - name: Deploy to Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy deploy/modal_app.py
